  securitySchemes:
    OAuth2:
      type: oauth2
      description: '{  "BuildEieHeader" : "map",  "SecurityTemplate" : "AppPrivApp(APPPII+APPPHI)",    "Backend"
        : "IIB",  "Errorhandlingpolicy": "Standard Policy",  "Consumer":Internal",  "Mutual
        Auth between Consumer and APIC" : "Not Required"  }'
      x-ibm-oauth-provider: v3-internal-auth-oauth2-privapp-token
      flows:
        clientCredentials:
          tokenUrl: /v3/internal/auth/oauth2/privapp/token
          scopes:
            APPPHI: APPPHI
            APPPII: APPPII
    AccessTokenAuth:
      type: http
      description: Use the access_token retrived from the token exchange call as a
        Bearer token
      scheme: bearer
      bearerFormat: opaque
