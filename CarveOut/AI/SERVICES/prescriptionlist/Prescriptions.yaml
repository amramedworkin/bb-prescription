  "components":
    {
      "schemas":
        {
          "prescriptionDetailResponse":
            {
              "title": "prescriptionDetailResponse",
              "required":
                [
                  "claimId",
                  "prescriptionId",
                  "lastFilledDate",
                  "memberFirstName",
                  "memberLastName",
                  "relationshipToSubscriber",
                  "membershipResourceId",
                  "memberResourceId",
                  "drug",
                  "quantity",
                  "daysSupply",
                  "prescriberName",
                  "fulfilledBy",
                  "estimatedCost",
                  "prescriptionNumber",
                  "statusText",
                ],
              "type": "object",
              "properties":
                {
                  "information":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/information" },
                      "description": "",
                    },
                  "claimId":
                    {
                      "type": "string",
                      "description": "Identification number for the claim.",
                      "example": "200023611694001",
                    },
                  "prescriptionId":
                    {
                      "type": "string",
                      "description": "Identification number of the prescription.",
                      "example": "674529584",
                    },
                  "lastFilledDate":
                    {
                      "type": "string",
                      "description": "Signifies the date the prescription was filled",
                      "example": "2018-04-12",
                    },
                  "memberFirstName": { "type": "string", "example": "John" },
                  "memberLastName": { "type": "string", "example": "Doe" },
                  "relationshipToSubscriber":
                    {
                      "type": "string",
                      "description": "Description of the relationship To Subscriber codes based upon ANSI X12 834 guidance as follows - Spouse , Father or Mother, Grandfather or Grandmother, Grandson or Granddaughter, Uncle or Aunt, Nephew or Niece, Cousin, Adopted Child, Foster Child, Son-in-law or Daughter-in-law, Brother-in-law or Sister-in-law, Mother-in-law or Father-in-law, Brother or Sister, Ward, Stepparent, Stepson or Stepdaughter, Self, Child, Sponsored Dependent, Dependent of a Minor Dependent, Ex-spouse, Guardian, Court Appointed Guardian, Collateral Dependent, Life Partner, Annuitant, Trustee, Other Relationship, Other Relative.Permitted values are as follows - Self, Other Relative.",
                      "example": "Self",
                    },
                  "membershipResourceId":
                    {
                      "type": "string",
                      "description": "the membershipResourceId",
                      "example": "5~263801696+31+1+20180101+788678+C+3",
                    },
                  "memberResourceId":
                    {
                      "type": "string",
                      "description": "the memberResourceId",
                      "example": "41~263801696",
                    },
                  "drug": { "$ref": "#/components/schemas/drug" },
                  "quantity":
                    {
                      "type": "number",
                      "description": "Quantity of the drug.",
                      "example": 15,
                    },
                  "daysSupply":
                    {
                      "type": "integer",
                      "description": "This indicates the number of days of supply for this prescription",
                      "format": "int32",
                      "example": 5,
                    },
                  "prescriberName":
                    {
                      "type": "string",
                      "description": "Name of the Prescriber",
                      "example": "John Doe",
                      "nullable": true,
                    },
                  "prescriberFirstName":
                    {
                      "type": "string",
                      "description": "First name of the prescriber",
                      "example": "Jane",
                    },
                  "prescriberLastName":
                    {
                      "type": "string",
                      "description": "Last name of the prescriber",
                      "example": "Doe",
                    },
                  "prescriberNpiNumber":
                    {
                      "type": "string",
                      "description": "National Provider Identifier of the prescriber. A National Provider Identifier (NPI) is a unique 10-digit identification number issued to health care providers in the United States by the Centers for Medicare and Medicaid Services (CMS)",
                      "example": "12345",
                    },
                  "fulfilledBy":
                    {
                      "type": "string",
                      "description": "Pharmacy name",
                      "example": "Caremark prescription service",
                    },
                  "estimatedCost":
                    {
                      "type": "number",
                      "description": "total amount of payment",
                      "example": 111,
                    },
                  "autoRefill":
                    {
                      "type": "boolean",
                      "description": "This flag indicates whether the prescription is enrolled for auto-refill. This is required for MAIL refillType.",
                      "example": false,
                    },
                  "isAutoRefillAllowed":
                    {
                      "type": "boolean",
                      "description": "This flag indicates whether the prescription is eligible for auto-refill. This is required for MAIL refillType.",
                      "example": false,
                    },
                  "autoRefillNotAllowedReason":
                    {
                      "type": "array",
                      "items": { "type": "string" },
                      "description": "This field indicates if the member's plan allows for auto-refill enrollment. Member level field. This is required for MAIL refillType.",
                    },
                  "prescriptionExpirationDate":
                    {
                      "type": "string",
                      "description": "the expiration date of the prescription in yyyy‑mm‑dd",
                      "example": "2018-04-12",
                      "nullable": true,
                    },
                  "prescriptionNumber":
                    {
                      "type": "string",
                      "description": "the unique Rx number of the prescription",
                      "example": "674529584",
                    },
                  "refillType":
                    {
                      "type": "string",
                      "description": 'The refill type, example RETAIL, MAIL. If the refillType= "MAIL", then mailOrderResponse will contain the order details.',
                      "example": "MAIL",
                    },
                  "refillsLeft":
                    {
                      "type": "integer",
                      "description": "Number of refills remaining",
                      "format": "int32",
                      "example": 3,
                      "nullable": true,
                    },
                  "rxStatus":
                    {
                      "type": "string",
                      "description": "The refill status which includes refill, renew or order status. Applicable only for retail refills.",
                      "example": "Ready for Refill",
                    },
                  "refillStatusText":
                    {
                      "type": "string",
                      "description": "The refill status. Applicable only for mail order refills.",
                      "example": "Available Now",
                    },
                  "renewStatusText":
                    {
                      "type": "string",
                      "description": "The renew status. Applicable only for mail order refills.",
                      "example": "One-time renew",
                    },
                  "statusDescription":
                    {
                      "type": "string",
                      "description": "The user friendly description of the status.",
                      "example": "Available to Refill",
                    },
                  "nextFillDate":
                    {
                      "type": "string",
                      "description": "This field indicates the date when the prescription is due for refill.",
                      "example": "2019-02-21",
                    },
                  "orderNumber":
                    {
                      "type": "string",
                      "description": "The order number.",
                      "example": "2261665002",
                    },
                  "needsShipConsent":
                    {
                      "type": "boolean",
                      "description": "If the order needs a consent from the member, this flag will be set to true or else false.",
                      "example": true,
                    },
                  "trackingNumber":
                    {
                      "type": "string",
                      "description": "The tracking number for the order.",
                      "example": "125281891",
                    },
                  "trackingURL":
                    {
                      "type": "string",
                      "description": "The tracking url for tracking the order. This is populated only when orderStatus is SHIPPED.",
                      "example": "https://www.ups.com/track?loc=en_US&requester=WT#/",
                    },
                  "statusText":
                    {
                      "type": "string",
                      "description": "status of the prescription",
                      "example": "UPCOMING_REFILLS",
                    },
                },
            },
