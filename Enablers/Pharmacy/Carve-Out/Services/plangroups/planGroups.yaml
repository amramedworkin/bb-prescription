                  format: date
                  example: '1999-03-19'
                nameFirst:
                  type: string
                  example: David
                nameLast:
                  type: string
                  example: Martin
                gender:
                  type: string
                  example: MALE
                phiRestrictionType:
                  type: string
                  example: PHI-MA
                individualIdProxy:
                  type: string
